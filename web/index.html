<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Canary</title>
<style>
  :root { color-scheme: dark light; font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; }
  body { margin: 0; display: flex; flex-direction: column; height: 100vh; }
  header { padding: 8px 12px; border-bottom: 1px solid #4444; display: flex; gap: 8px; align-items: center; }
  header select, header button { font: inherit; padding: 4px 8px; }
  #log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 80%; padding: 8px 12px; border-radius: 8px; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #2a6cdf22; }
  .msg.assistant { background: #6663; }
  .tool { font-family: ui-monospace, monospace; font-size: 12px; background: #8881; border-left: 3px solid #888; padding: 6px 10px; margin: 4px 0; }
  .tool summary { cursor: pointer; }
  .tool pre { margin: 4px 0 0; white-space: pre-wrap; word-break: break-word; }
  form { display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid #4444; }
  #input { flex: 1; font: inherit; padding: 6px 8px; }
  #slash { position: absolute; bottom: 50px; left: 12px; background: #222; border: 1px solid #555; max-height: 200px; overflow-y: auto; display: none; }
  #slash div { padding: 4px 8px; cursor: pointer; }
  #slash div:hover { background: #444; }
</style>
</head>
<body>
<header>
  <strong>Canary</strong>
  <select id="model"></select>
  <button id="reset">Reset</button>
  <button id="refresh-mcp">Refresh MCP</button>
  <button id="manage">Manage</button>
  <span id="status" style="margin-left:auto; opacity:0.6;"></span>
</header>
<div id="log"></div>
<div id="slash"></div>
<form id="form">
  <input id="input" autocomplete="off" placeholder="Message…  (type / for MCP prompts)" autofocus>
  <button>Send</button>
</form>

<div id="drawer" style="display:none; position:fixed; top:0; right:0; width:560px; height:100vh; background:#1a1a1a; border-left:1px solid #555; box-shadow:-4px 0 16px #0008; padding:12px; overflow-y:auto; z-index:10;">
  <div style="display:flex; gap:8px; align-items:center; margin-bottom:8px;">
    <strong>Manage</strong>
    <select id="m-kind">
      <option value="mcp">MCP servers (config/mcp.json)</option>
      <option value="skills">Skills</option>
      <option value="subagents">Subagents</option>
    </select>
    <button id="m-close" style="margin-left:auto;">×</button>
  </div>
  <div id="m-list" style="margin-bottom:8px;"></div>
  <div id="m-editor-wrap" style="display:none;">
    <input id="m-name" placeholder="name" style="width:200px; margin-bottom:4px;">
    <textarea id="m-text" style="width:100%; height:60vh; font-family:ui-monospace,monospace; font-size:12px; background:#111; color:#ddd; border:1px solid #444; padding:6px;"></textarea>
    <div style="margin-top:6px; display:flex; gap:6px;">
      <button id="m-save">Save</button>
      <button id="m-delete">Delete</button>
      <span id="m-status" style="margin-left:auto; opacity:0.7;"></span>
    </div>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
